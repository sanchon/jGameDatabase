# Test profile: isolated in-memory H2 database.
# Activated via @ActiveProfiles("test") so the "local" profile (and any
# application-local.properties with real secrets) is never loaded.

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

spring.h2.console.enabled=false

# Placeholder credentials keep the external API beans bootstrapping without real secrets.
igdb.client-id=test-client-id
igdb.client-secret=test-client-secret
ggdeals.api-key=test-api-key
ggdeals.region=es

app.backup.dir=./build/test-backups

# Disable the GG.deals rate-limit cache in tests so assertions are deterministic
ggdeals.min-interval-ms=0
